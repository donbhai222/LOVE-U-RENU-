<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For Renu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1f052d 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 2;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4757;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }

        h1 {
            color: #ff6b81;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bomb-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.8);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .bomb-btn:active {
            transform: scale(0.92);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        /* Extreme Small & Super Glowing Hearts */
        .tiny-heart {
            position: absolute;
            font-size: 8px;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 6px #ff4757, 0 0 12px #ff6b81;
            will-change: transform, left, top, opacity;
        }

        /* Flash background on blast */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 105, 180, 0.25);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        .center-love-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 20;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff4757, 0 0 35px #ff6b81, 0 0 50px #ff4757;
            text-align: center;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            width: 90%;
        }

        .center-love-text.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .typewriter-msg {
            font-size: 14px;
            font-weight: 500;
            color: #ffeaa7;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(255, 234, 167, 0.9);
            min-height: 24px;
        }

        .replay-btn {
            margin-top: 20px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 18px rgba(255, 71, 87, 0.6);
            transition: transform 0.2s;
        }

        .replay-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="flash" id="flashLayer"></div>

    <div class="container" id="mainCard">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Cute Memory" class="profile-img">
        
        <h1>Hey Renu! ❤️</h1>
        <p class="subtitle">Press the bomb for a magical explosion...</p>

        <button class="bomb-btn" id="igniteBtn" onclick="startSurprise()">
            <span>Touch to Light Bomb</span> 💣✨
        </button>
    </div>

    <div id="canvas-container"></div>
    
    <div class="center-love-text" id="loveText">
        Deepanshu<br>❤️<br>Love Renu
        
        <div class="typewriter-msg" id="typewriter"></div>

        <button class="replay-btn" onclick="resetSurprise()">Play Again 🔄</button>
    </div>

    <script>
        const messageText = "You are the most precious person in my life! ✨🌸";

        function startSurprise() {
            const btn = document.getElementById('igniteBtn');
            const card = document.getElementById('mainCard');

            btn.style.pointerEvents = 'none';
            btn.innerHTML = 'Fuse Burning... 🧨';

            // Card fade and shrink
            setTimeout(() => {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.8)';
                setTimeout(() => { card.style.display = 'none'; }, 400);

                // Trigger Flash & Mega Bomb Explosion
                triggerBlastFlash();
                createMegaBombExplosion();
            }, 700);
        }

        function triggerBlastFlash() {
            const flash = document.getElementById('flashLayer');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 200);
        }

        function createMegaBombExplosion() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            const totalHearts = 420; // Massive amount of hearts
            const hearts = [];

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Step 1: Create 420 tiny hearts at bomb center
            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'tiny-heart';
                const heartIcon = Math.random() > 0.25 ? '❤️' : (Math.random() > 0.5 ? '💖' : '✨');
                heart.innerHTML = heartIcon;

                heart.style.left = centerX + 'px';
                heart.style.top = centerY + 'px';

                container.appendChild(heart);
                hearts.push(heart);
            }

            // Step 2: High-Speed Burst Phase (Blast Outward)
            setTimeout(() => {
                hearts.forEach((heart) => {
                    heart.style.opacity = '1';
                    
                    // Explosive physics angles & distances
                    const angle = Math.random() * Math.PI * 2;
                    const maxDist = Math.max(window.innerWidth, window.innerHeight) * (0.35 + Math.random() * 0.35);
                    const scatterX = centerX + Math.cos(angle) * maxDist;
                    const scatterY = centerY + Math.sin(angle) * maxDist;

                    heart.style.transition = 'all 0.6s cubic-bezier(0.05, 0.9, 0.1, 1)';
                    heart.style.left = scatterX + 'px';
                    heart.style.top = scatterY + 'px';
                });

                // Step 3: Smooth Assembly into Big Heart Shape
                setTimeout(() => {
                    hearts.forEach((heart, index) => {
                        const t = (index / totalHearts) * 2 * Math.PI;
                        const scale = Math.min(window.innerWidth, window.innerHeight) / 36;
                        
                        // Heart Formula
                        const heartX = 16 * Math.pow(Math.sin(t), 3);
                        const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                        const targetX = centerX + heartX * scale;
                        const targetY = centerY + heartY * scale;

                        // Smooth floating convergence
                        heart.style.transition = 'all 2.2s cubic-bezier(0.25, 1, 0.5, 1)';
                        heart.style.left = targetX + 'px';
                        heart.style.top = targetY + 'px';
                    });

                    // Step 4: Show Animated Love Text
                    setTimeout(() => {
                        document.getElementById('loveText').classList.add('show');
                        typeWriterEffect();
                    }, 1600);

                }, 650);

            }, 40);
        }

        function typeWriterEffect() {
            let i = 0;
            const el = document.getElementById('typewriter');
            el.innerHTML = '';
            
            function type() {
                if (i < messageText.length) {
                    el.innerHTML += messageText.charAt(i);
                    i++;
                    setTimeout(type, 45);
                }
            }
            type();
        }

        function resetSurprise() {
            document.getElementById('loveText').classList.remove('show');
            document.getElementById('canvas-container').innerHTML = '';
            document.getElementById('typewriter').innerHTML = '';
            
            const card = document.getElementById('mainCard');
            const btn = document.getElementById('igniteBtn');
            
            card.style.display = 'block';
            setTimeout(() => { 
                card.style.opacity = '1'; 
                card.style.transform = 'scale(1)';
            }, 50);
            
            btn.style.pointerEvents = 'auto';
            btn.innerHTML = 'Touch to Light Bomb 💣✨';
        }
    </script>
</body>
</html>
