<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For Renu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle, #2a0845 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 2;
            transition: opacity 0.5s ease;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4757;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        h1 {
            color: #ff6b81;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bomb-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .bomb-btn:active {
            transform: scale(0.95);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .small-heart {
            position: absolute;
            font-size: 16px;
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 1;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.9);
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .center-love-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 20;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff4757, 0 0 30px #ff6b81;
            text-align: center;
            transition: transform 1s ease-out;
            pointer-events: none;
            width: 90%;
        }

        .center-love-text.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 3. Typewriter Text Style */
        .typewriter-msg {
            font-size: 14px;
            font-weight: 500;
            color: #ffeaa7;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(255, 234, 167, 0.8);
            min-height: 24px;
        }

        .replay-btn {
            margin-top: 20px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
            transition: transform 0.2s;
        }

        .replay-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Cute Memory" class="profile-img">
        
        <h1>Hey Renu! ❤️</h1>
        <p class="subtitle">Press the bomb for a magical surprise...</p>

        <button class="bomb-btn" id="igniteBtn" onclick="startSurprise()">
            <span>Touch to Light Bomb</span> 💣✨
        </button>
    </div>

    <div id="canvas-container"></div>
    
    <div class="center-love-text" id="loveText">
        Deepanshu<br>❤️<br>Love Renu
        
        <!-- 3. Typewriter Message Placeholder -->
        <div class="typewriter-msg" id="typewriter"></div>

        <button class="replay-btn" onclick="resetSurprise()">Play Again 🔄</button>
    </div>

    <script>
        // Aap message change kar sakte ho yahan:
        const messageText = "You are the most precious person in my life! ✨🌸";

        function startSurprise() {
            const btn = document.getElementById('igniteBtn');
            const card = document.getElementById('mainCard');

            btn.style.pointerEvents = 'none';
            btn.innerHTML = 'Lighting Fuse... 🧨';

            setTimeout(() => {
                card.style.opacity = '0';
                setTimeout(() => { card.style.display = 'none'; }, 500);
                createHeartsExplosion();
                createConfettiBlast(); // 4. Confetti Blast Trigger
            }, 1000);
        }

        function createHeartsExplosion() {
            const container = document.getElementById('canvas-container');
            const totalHearts = 90;
            const hearts = [];

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'small-heart';
                heart.innerHTML = Math.random() > 0.3 ? '❤️' : '💖';

                const startX = centerX + (Math.random() - 0.5) * 350;
                const startY = centerY + (Math.random() - 0.5) * 350;

                heart.style.left = startX + 'px';
                heart.style.top = startY + 'px';

                container.appendChild(heart);
                hearts.push(heart);
            }

            setTimeout(() => {
                hearts.forEach((heart, index) => {
                    const t = (index / totalHearts) * 2 * Math.PI;
                    const scale = Math.min(window.innerWidth, window.innerHeight) / 35;
                    
                    const heartX = 16 * Math.pow(Math.sin(t), 3);
                    const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    const targetX = centerX + heartX * scale;
                    const targetY = centerY + heartY * scale;

                    heart.style.left = targetX + 'px';
                    heart.style.top = targetY + 'px';
                });

                setTimeout(() => {
                    document.getElementById('loveText').classList.add('show');
                    typeWriterEffect(); // 3. Start Typewriter
                }, 1500);

            }, 600);
        }

        // 4. Confetti Rain Animation
        function createConfettiBlast() {
            const container = document.getElementById('canvas-container');
            const colors = ['#ff4757', '#ff6b81', '#ffeaa7', '#74b9ff', '#a29bfe'];

            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                
                container.appendChild(confetti);
            }
        }

        // 3. Typewriter Function
        function typeWriterEffect() {
            let i = 0;
            const el = document.getElementById('typewriter');
            el.innerHTML = '';
            
            function type() {
                if (i < messageText.length) {
                    el.innerHTML += messageText.charAt(i);
                    i++;
                    setTimeout(type, 60);
                }
            }
            type();
        }

        function resetSurprise() {
            document.getElementById('loveText').classList.remove('show');
            document.getElementById('canvas-container').innerHTML = '';
            document.getElementById('typewriter').innerHTML = '';
            
            const card = document.getElementById('mainCard');
            const btn = document.getElementById('igniteBtn');
            
            card.style.display = 'block';
            setTimeout(() => { card.style.opacity = '1'; }, 50);
            
            btn.style.pointerEvents = 'auto';
            btn.innerHTML = 'Touch to Light Bomb 💣✨';
        }
    </script>
</body>
</html>
