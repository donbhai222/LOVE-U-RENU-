<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For Renu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle, #2a0845 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 2;
            transition: opacity 0.5s ease;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4757;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        h1 {
            color: #ff6b81;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bomb-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .bomb-btn:active {
            transform: scale(0.95);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        /* Hearts ko chhota aur fast movement ke liye */
        .small-heart {
            position: absolute;
            font-size: 10px; /* Size chhota kiya gaya hai */
            transition: all 1.8s cubic-bezier(0.1, 1, 0.3, 1);
            opacity: 1;
            text-shadow: 0 0 6px rgba(255, 105, 180, 0.9);
        }

        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: fall 2.5s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .center-love-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 20;
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff4757, 0 0 30px #ff6b81;
            text-align: center;
            transition: transform 0.8s ease-out;
            pointer-events: none;
            width: 90%;
        }

        .center-love-text.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .typewriter-msg {
            font-size: 13px;
            font-weight: 500;
            color: #ffeaa7;
            margin-top: 12px;
            text-shadow: 0 0 8px rgba(255, 234, 167, 0.8);
            min-height: 22px;
        }

        .replay-btn {
            margin-top: 18px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
            transition: transform 0.2s;
        }

        .replay-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Cute Memory" class="profile-img">
        
        <h1>Hey Renu! ❤️</h1>
        <p class="subtitle">Press the bomb for a magical surprise...</p>

        <button class="bomb-btn" id="igniteBtn" onclick="startSurprise()">
            <span>Touch to Light Bomb</span> 💣✨
        </button>
    </div>

    <div id="canvas-container"></div>
    
    <div class="center-love-text" id="loveText">
        Deepanshu<br>❤️<br>Love Renu
        
        <div class="typewriter-msg" id="typewriter"></div>

        <button class="replay-btn" onclick="resetSurprise()">Play Again 🔄</button>
    </div>

    <script>
        const messageText = "You are the most precious person in my life! ✨🌸";

        function startSurprise() {
            const btn = document.getElementById('igniteBtn');
            const card = document.getElementById('mainCard');

            btn.style.pointerEvents = 'none';
            btn.innerHTML = 'Lighting Fuse... 🧨';

            setTimeout(() => {
                card.style.opacity = '0';
                setTimeout(() => { card.style.display = 'none'; }, 400);
                createHeartsExplosion();
                createConfettiBlast();
            }, 800);
        }

        function createHeartsExplosion() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            const totalHearts = 180; // Bahut saare hearts badha diye hain
            const hearts = [];

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Step 1: Center se ekdum blast hoke phailna (Explosion center)
            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'small-heart';
                heart.innerHTML = Math.random() > 0.2 ? '❤️' : '💖';

                // Sabhi hearts bilkul center (bomb point) se shuru honge
                heart.style.left = centerX + 'px';
                heart.style.top = centerY + 'px';

                container.appendChild(heart);
                hearts.push(heart);
            }

            // Step 2: Blast hone ke baad turant random bikharna aur fir Big Heart banana
            setTimeout(() => {
                hearts.forEach((heart) => {
                    const angle = Math.random() * Math.PI * 2;
                    const blastRadius = Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.45;
                    const scatterX = centerX + Math.cos(angle) * blastRadius;
                    const scatterY = centerY + Math.sin(angle) * blastRadius;

                    heart.style.left = scatterX + 'px';
                    heart.style.top = scatterY + 'px';
                });

                // Step 3: Bikhre hue hearts ka wapas aakar Big Heart shape lena
                setTimeout(() => {
                    hearts.forEach((heart, index) => {
                        const t = (index / totalHearts) * 2 * Math.PI;
                        const scale = Math.min(window.innerWidth, window.innerHeight) / 38;
                        
                        const heartX = 16 * Math.pow(Math.sin(t), 3);
                        const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                        const targetX = centerX + heartX * scale;
                        const targetY = centerY + heartY * scale;

                        heart.style.left = targetX + 'px';
                        heart.style.top = targetY + 'px';
                    });

                    // Step 4: Text aur Typewriter show karna
                    setTimeout(() => {
                        document.getElementById('loveText').classList.add('show');
                        typeWriterEffect();
                    }, 1200);

                }, 800);

            }, 50);
        }

        function createConfettiBlast() {
            const container = document.getElementById('canvas-container');
            const colors = ['#ff4757', '#ff6b81', '#ffeaa7', '#74b9ff', '#a29bfe'];

            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '50vh'; // Center se blast hoga
                confetti.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                
                container.appendChild(confetti);
            }
        }

        function typeWriterEffect() {
            let i = 0;
            const el = document.getElementById('typewriter');
            el.innerHTML = '';
            
            function type() {
                if (i < messageText.length) {
                    el.innerHTML += messageText.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }

        function resetSurprise() {
            document.getElementById('loveText').classList.remove('show');
            document.getElementById('canvas-container').innerHTML = '';
            document.getElementById('typewriter').innerHTML = '';
            
            const card = document.getElementById('mainCard');
            const btn = document.getElementById('igniteBtn');
            
            card.style.display = 'block';
            setTimeout(() => { card.style.opacity = '1'; }, 50);
            
            btn.style.pointerEvents = 'auto';
            btn.innerHTML = 'Touch to Light Bomb 💣✨';
        }
    </script>
</body>
</html>
